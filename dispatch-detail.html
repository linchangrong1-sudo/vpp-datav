<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时调度工作站 - VPP 虚拟电厂</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root {
  --bg-deep: #0a0e27; --bg-panel: rgba(6, 30, 60, 0.75);
  --border-glow: rgba(0, 200, 255, 0.35); --accent: #00d4ff;
  --accent2: #00ff88; --accent3: #ff6b6b; --accent4: #ffaa00;
  --text-primary: #e0f0ff; --text-secondary: #7eb8da;
  --glow-soft: 0 0 20px rgba(0, 180, 255, 0.15);
  --glow-strong: 0 0 30px rgba(0, 200, 255, 0.4);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background: var(--bg-deep); color: var(--text-primary);
  font-family: 'Microsoft YaHei','PingFang SC',sans-serif;
  height: 100vh; overflow: hidden;
}
#bgCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}

.container{
  position:relative;z-index:1;height:100vh;
  display:flex;flex-direction:column;padding:12px 16px;
}

/* Header */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:10px;border-bottom:1px solid rgba(0,200,255,0.2);
  flex-shrink:0;margin-bottom:10px;
}
.header-left{display:flex;align-items:center;gap:12px;}
.header-logo{
  width:34px;height:34px;background:linear-gradient(135deg,var(--accent4),var(--accent3));
  border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:bold;color:#fff;box-shadow:0 0 18px rgba(255,170,0,0.5);
}
.header-title{font-size:18px;font-weight:700;letter-spacing:2px;}
.header-breadcrumb{font-size:12px;color:var(--text-secondary);}
.header-breadcrumb span{color:var(--accent);cursor:pointer;}
.header-breadcrumb span:hover{text-decoration:underline;}
.header-center{font-size:13px;color:var(--text-secondary);}
.header-center .time{font-size:24px;font-weight:700;color:#e0f0ff;font-family:'Consolas',monospace;letter-spacing:1px;}
.header-right{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-secondary);}
.header-right .live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent3);box-shadow:0 0 8px var(--accent3);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

.body{flex:1;display:flex;gap:12px;min-height:0;}

/* Left Sidebar */
.sidebar{
  width:200px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;
  overflow-y:auto;
}
.sidebar::-webkit-scrollbar{width:3px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--border-glow);border-radius:3px;}
.side-nav{
  background:var(--bg-panel);border:1px solid var(--border-glow);
  border-radius:8px;padding:8px;position:relative;
  backdrop-filter:blur(8px);box-shadow:var(--glow-soft);
}
.side-nav::before{
  content:'';position:absolute;top:-1px;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
}
.nav-title{font-size:11px;color:var(--text-secondary);padding:4px 8px 6px;text-align:center;border-bottom:1px solid rgba(0,180,255,0.1);margin-bottom:4px;}
.nav-item{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-radius:6px;cursor:pointer;transition:all .3s;
  border-left:2px solid transparent;margin-bottom:2px;font-size:12px;
  color:var(--text-secondary);
}
.nav-item:hover{background:rgba(0,200,255,0.06);color:var(--text-primary);}
.nav-item.active{
  background:rgba(0,200,255,0.12);color:var(--accent);
  border-left-color:var(--accent);box-shadow:inset 0 0 12px rgba(0,200,255,0.08);
}
.nav-item .nav-icon{font-size:16px;flex-shrink:0;}
.nav-item .nav-badge{font-size:9px;padding:2px 6px;border-radius:8px;margin-left:auto;}

/* Main Area */
.main{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0;}

/* Top Status Bar */
.status-bar{
  display:flex;gap:10px;flex-shrink:0;
}
.status-chip{
  flex:1;background:var(--bg-panel);border:1px solid var(--border-glow);
  border-radius:6px;padding:10px 14px;position:relative;
  backdrop-filter:blur(8px);box-shadow:var(--glow-soft);
  display:flex;align-items:center;gap:10px;
}
.status-chip .chip-icon{font-size:22px;flex-shrink:0;}
.status-chip .chip-info{flex:1;min-width:0;}
.status-chip .chip-label{font-size:10px;color:var(--text-secondary);}
.status-chip .chip-value{font-size:20px;font-weight:700;font-family:'Consolas',monospace;}
.status-chip .chip-sub{font-size:9px;color:var(--text-secondary);margin-top:1px;}

/* Content Rows */
.content-row{display:flex;gap:10px;flex:1;min-height:0;}
.content-col{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0;}

.panel{
  background:var(--bg-panel);border:1px solid var(--border-glow);
  border-radius:8px;padding:12px 14px;position:relative;
  backdrop-filter:blur(8px);box-shadow:var(--glow-soft);
}
.panel::before{
  content:'';position:absolute;top:-1px;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
}
.panel-title{
  font-size:13px;font-weight:700;margin-bottom:10px;
  padding-left:10px;border-left:3px solid var(--accent);
  display:flex;align-items:center;gap:6px;flex-shrink:0;
}
.chart-box{width:100%;height:100%;min-height:150px;}

/* SOC Ring */
.soc-ring-wrap{
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:4px;
}
.soc-ring{
  width:120px;height:120px;border-radius:50%;
  background:conic-gradient(var(--accent2) 0deg, var(--accent2) 280deg, rgba(0,40,80,0.8) 280deg, rgba(0,40,80,0.8) 360deg);
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.soc-ring::after{
  content:'';position:absolute;width:90px;height:90px;border-radius:50%;
  background:var(--bg-panel);backdrop-filter:blur(8px);
}
.soc-num{position:relative;z-index:1;font-size:28px;font-weight:700;font-family:'Consolas',monospace;color:var(--accent2);}

/* Temperature / PCS alert */
.alert-indicator{
  display:flex;align-items:center;gap:6px;padding:6px 10px;
  border-radius:4px;font-size:11px;
}
.alert-indicator.safe{background:rgba(0,255,136,0.06);border:1px solid rgba(0,255,136,0.2);color:var(--accent2);}
.alert-indicator.danger{background:rgba(255,107,107,0.1);border:1px solid var(--accent3);color:var(--accent3);animation:flashAl 1.5s infinite;}
@keyframes flashAl{0%,100%{opacity:1}50%{opacity:0.5}}

/* Priority Table */
.prio-table{width:100%;font-size:10px;border-collapse:collapse;}
.prio-table th{text-align:left;padding:4px 8px;color:var(--text-secondary);border-bottom:1px solid rgba(0,180,255,0.15);}
.prio-table td{padding:5px 8px;border-bottom:1px solid rgba(0,180,255,0.06);}
.prio-table .prio-high{color:var(--accent3);}
.prio-table .prio-low{color:var(--accent2);}
.prio-badge{font-size:8px;padding:1px 5px;border-radius:3px;}
.prio-badge.high{background:rgba(255,107,107,0.2);color:var(--accent3);}
.prio-badge.low{background:rgba(0,255,136,0.15);color:var(--accent2);}
.prio-badge.locked{background:rgba(255,130,100,0.2);color:#ff8264;}
.prio-badge.ok{background:rgba(0,200,255,0.12);color:var(--accent);}

/* Dispatch Form */
.form-section{margin-bottom:10px;}
.form-section .sec-label{font-size:10px;color:var(--text-secondary);margin-bottom:4px;text-transform:uppercase;letter-spacing:1px;}
.form-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.form-row label{font-size:11px;color:var(--text-secondary);width:85px;flex-shrink:0;text-align:right;}
.form-row input,.form-row select{
  flex:1;padding:6px 10px;font-size:12px;
  background:rgba(0,20,50,0.6);border:1px solid rgba(0,200,255,0.25);
  border-radius:4px;color:var(--text-primary);
  outline:none;font-family:inherit;
  transition:border-color .3s;
}
.form-row input:focus,.form-row select:focus{border-color:var(--accent);box-shadow:0 0 10px rgba(0,200,255,0.15);}
.form-row select{appearance:none;cursor:pointer;}
.form-row select option{background:var(--bg-deep);color:var(--text-primary);}
input[type=range]{
  -webkit-appearance:none;width:100%;height:5px;
  background:rgba(0,200,255,0.2);border-radius:3px;outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;
  background:var(--accent);border-radius:50%;cursor:pointer;
  box-shadow:0 0 12px rgba(0,200,255,0.5);border:2px solid #e0f0ff;
}
.range-dual{
  display:flex;align-items:center;gap:6px;flex:1;
}
.range-dual span{font-size:10px;color:var(--text-secondary);white-space:nowrap;}
.range-val{font-size:12px;font-weight:600;min-width:40px;text-align:center;}

/* Mode Switch */
.mode-switch{display:flex;gap:0;margin-bottom:8px;}
.mode-btn{
  flex:1;padding:8px;border:1px solid rgba(0,200,255,0.25);cursor:pointer;
  font-size:11px;text-align:center;transition:all .3s;
  background:rgba(0,20,50,0.4);color:var(--text-secondary);
  font-family:inherit;
}
.mode-btn:first-child{border-radius:6px 0 0 6px;}
.mode-btn:last-child{border-radius:0 6px 6px 0;}
.mode-btn.active{
  background:rgba(0,200,255,0.15);color:var(--accent);
  border-color:var(--accent);box-shadow:0 0 10px rgba(0,200,255,0.2);
}

/* Tier Selector */
.tier-row{display:flex;gap:6px;flex-wrap:wrap;}
.tier-chip{
  padding:6px 12px;border:1px solid rgba(0,200,255,0.2);
  border-radius:4px;cursor:pointer;font-size:11px;transition:all .3s;
  background:rgba(0,20,50,0.4);color:var(--text-secondary);
}
.tier-chip:hover{border-color:var(--accent);color:var(--text-primary);}
.tier-chip.active{border-color:var(--accent);background:rgba(0,200,255,0.12);color:var(--accent);}
.tier-chip.blocked{opacity:0.4;cursor:not-allowed;border-color:var(--accent3);}
.tier-chip.blocked::after{content:' ✕';color:var(--accent3);font-weight:bold;}

/* Checkbox */
.check-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-secondary);}
.check-row input[type=checkbox]{accent-color:var(--accent);}
.check-row .required{color:var(--accent3);font-size:9px;margin-left:4px;}

/* Action Buttons */
.btn-row{display:flex;gap:8px;margin-top:6px;}
.btn{
  flex:1;padding:10px 0;border-radius:6px;font-size:12px;
  font-weight:600;cursor:pointer;border:none;
  transition:all .3s;font-family:inherit;
}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),#0066ff);
  color:#fff;box-shadow:0 0 14px rgba(0,200,255,0.3);
}
.btn-primary:hover{box-shadow:0 0 22px rgba(0,200,255,0.6);transform:translateY(-1px);}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;box-shadow:none;transform:none;}
.btn-danger{
  background:linear-gradient(135deg,var(--accent3),#cc0000);
  color:#fff;box-shadow:0 0 12px rgba(255,107,107,0.3);
}
.btn-danger:hover{box-shadow:0 0 20px rgba(255,107,107,0.6);transform:translateY(-1px);}
.btn-outline{
  background:transparent;color:var(--accent);
  border:1px solid var(--accent);
}
.btn-outline:hover{background:rgba(0,200,255,0.1);}

/* Constraint Warning */
.constraint-warn{
  display:none;padding:8px 10px;border-radius:4px;font-size:10px;
  background:rgba(255,107,107,0.1);border:1px dashed var(--accent3);
  color:var(--accent3);margin-bottom:6px;
}
.constraint-warn.show{display:block;}

/* Contract Limit Bar */
.contract-bar{
  height:6px;background:rgba(255,255,255,0.08);border-radius:3px;
  overflow:hidden;position:relative;margin-top:2px;
}
.contract-bar .used{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent2),var(--accent4));transition:width .5s;}
.contract-bar .limit-marker{
  position:absolute;top:-4px;width:2px;height:14px;
  background:var(--accent3);border-radius:1px;
}

/* Toasts */
.toast{
  position:fixed;top:20px;right:20px;z-index:100;
  padding:12px 24px;border-radius:6px;font-size:13px;font-weight:600;
  opacity:0;transform:translateY(-20px);transition:all .4s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateY(0);}
.toast.success{background:rgba(0,255,136,0.15);border:1px solid var(--accent2);color:var(--accent2);}
.toast.error{background:rgba(255,107,107,0.15);border:1px solid var(--accent3);color:var(--accent3);}

/* History Log */
.history-log{font-size:10px;max-height:100px;overflow-y:auto;}
.history-log::-webkit-scrollbar{width:3px;}
.history-log::-webkit-scrollbar-thumb{background:var(--border-glow);border-radius:3px;}
.history-item{
  display:flex;align-items:center;gap:8px;padding:4px 6px;
  border-bottom:1px solid rgba(0,180,255,0.06);
}
.history-item .h-time{color:var(--text-secondary);white-space:nowrap;}
.history-item .h-user{color:var(--accent);}
.history-item .h-action{flex:1;}
.history-item .h-result{padding:1px 6px;border-radius:3px;font-size:9px;}
.history-item .h-result.ok{background:rgba(0,255,136,0.12);color:var(--accent2);}

/* Station Cards */
.station-list{display:flex;flex-direction:column;gap:4px;max-height:120px;overflow-y:auto;}
.station-list::-webkit-scrollbar{width:3px;}
.station-list::-webkit-scrollbar-thumb{background:var(--border-glow);border-radius:3px;}
.station-card{
  display:flex;align-items:center;gap:8px;padding:6px 8px;
  border-radius:4px;background:rgba(0,180,255,0.04);
  border:1px solid rgba(0,180,255,0.08);cursor:pointer;font-size:11px;
  transition:all .3s;
}
.station-card:hover{background:rgba(0,200,255,0.08);border-color:var(--border-glow);}
.station-card.selected{border-color:var(--accent);background:rgba(0,200,255,0.1);}
.station-card .s-name{flex:1;font-weight:600;}
.station-card .s-power{color:var(--accent);font-family:'Consolas',monospace;}
.station-card .s-cars{font-size:10px;color:var(--text-secondary);}

/* Bottom bar */
.bottom-bar{
  height:140px;flex-shrink:0;display:flex;gap:10px;margin-top:10px;
}
.bottom-panel{
  flex:1;background:var(--bg-panel);border:1px solid var(--border-glow);
  border-radius:8px;position:relative;backdrop-filter:blur(8px);
  box-shadow:var(--glow-soft);padding:8px;
}
.bottom-panel::before{
  content:'';position:absolute;top:-1px;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
}

/* Countdown */
.countdown{font-size:22px;font-weight:700;font-family:'Consolas',monospace;}
.countdown.warning{color:var(--accent4);animation:flashAl 1s infinite;}
.countdown.urgent{color:var(--accent3);animation:flashAl 0.6s infinite;}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="toast" id="toast"></div>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="header-logo">⚡</div>
      <div>
        <div class="header-title">实时调度工作站</div>
        <div class="header-breadcrumb">VPP数字平台 / <span onclick="location.href='dispatch-overview.html'">调度总览</span> / <span>详细调度</span></div>
      </div>
    </div>
    <div class="header-center">
      <span class="time" id="liveTime">--:--:--</span>
    </div>
    <div class="header-right">
      <div class="live-dot"></div><span>调度模式: 手动控制</span>
      <span>|</span>
      <span>👤 调度员 · 张三</span>
      <button class="btn btn-outline" style="flex:none;padding:5px 14px;font-size:11px;" onclick="location.href='dispatch-overview.html'">← 返回总览</button>
    </div>
  </div>

  <!-- Body -->
  <div class="body">
    <!-- Left Sidebar -->
    <div class="sidebar">
      <div class="side-nav">
        <div class="nav-title">资源类型</div>
        <div class="nav-item active" data-type="solar" onclick="switchType('solar')">
          <span class="nav-icon">☀️</span>光伏调度
          <span class="nav-badge" style="background:rgba(255,170,0,0.15);color:#ffaa00;">6站</span>
        </div>
        <div class="nav-item" data-type="storage" onclick="switchType('storage')">
          <span class="nav-icon">🔋</span>储能调度
          <span class="nav-badge" style="background:rgba(0,255,136,0.15);color:#00ff88;">8站</span>
        </div>
        <div class="nav-item" data-type="load" onclick="switchType('load')">
          <span class="nav-icon">🏭</span>可控负荷
          <span class="nav-badge" style="background:rgba(255,130,100,0.15);color:#ff8264;">3节点</span>
        </div>
        <div class="nav-item" data-type="charger" onclick="switchType('charger')">
          <span class="nav-icon">🔌</span>充电桩群
          <span class="nav-badge" style="background:rgba(180,130,255,0.15);color:#b482ff;">6站</span>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main" id="mainContent"></div>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <div class="bottom-panel" id="bottomChart1"></div>
    <div class="bottom-panel" id="bottomChart2"></div>
  </div>
</div>

<script>
// ========== Background ==========
const canvas=document.getElementById('bgCanvas');
const ctx=canvas.getContext('2d');
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resizeCanvas();window.addEventListener('resize',resizeCanvas);
const particles=[];
class P{constructor(){this.reset();}reset(){this.x=Math.random()*canvas.width;this.y=Math.random()*canvas.height;this.r=Math.random()*1.5+0.5;this.vx=(Math.random()-0.5)*0.3;this.vy=(Math.random()-0.5)*0.3;this.a=Math.random()*0.4+0.15;}update(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>canvas.width||this.y<0||this.y>canvas.height)this.reset();}draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=`rgba(0,200,255,${this.a})`;ctx.fill();}}
for(let i=0;i<60;i++)particles.push(new P());
function animateBg(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='rgba(0,180,255,0.03)';ctx.lineWidth=0.5;
  for(let x=60;x<canvas.width;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
  for(let y=60;y<canvas.height;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}
  particles.forEach(p=>{p.update();p.draw();});
  requestAnimationFrame(animateBg);
}
animateBg();

// Clock
function updateTime(){document.getElementById('liveTime').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false});}
updateTime();setInterval(updateTime,1000);

// Toast
function showToast(type,msg){
  const t=document.getElementById('toast');
  t.className=`toast ${type} show`;
  t.textContent=msg;
  setTimeout(()=>t.classList.remove('show'),3000);
}

// ========== Type Switching ==========
let currentType='solar';
let bottomChart1=null,bottomChart2=null;

function switchType(type){
  currentType=type;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.type===type));
  renderMain(type);
  renderBottomCharts(type);
}

function renderMain(type){
  const mc=document.getElementById('mainContent');
  const r=renderers[type];
  mc.innerHTML=r?r():'';
  initTypeCharts(type);
  attachTypeEvents(type);
}

// ========== Each Type Renderer ==========
const renderers={
  solar:()=>`<div class="content-row" style="flex:1;">
    <div class="content-col" style="flex:2;">
      <div class="panel" style="flex:1;">
        <div class="panel-title">📊 超短期辐照预测 vs 实测功率 <span style="font-size:10px;color:var(--text-secondary);">(未来30min · 偏差>10%红标)</span></div>
        <div id="chartSolarPred" class="chart-box"></div>
      </div>
    </div>
    <div class="content-col" style="flex:1;">
      <div class="panel" style="flex:0 0 auto;">
        <div class="panel-title">⚠️ 限发记录</div>
        <div style="font-size:11px;">
          <div class="alert-indicator safe" style="margin-bottom:4px;">🟢 电网反送电限制: 50MW (当前出力 445MW，裕度充足)</div>
          <div class="alert-indicator safe">🟢 逆变器过载保护: 正常 (阈值 110%Pn)</div>

// ========== History Data ==========
const histories={
  solar:[],storage:[],load:[],charger:[]
};
function addHistory(type,action,result){
  const now=new Date();
  const t=now.toLocaleTimeString('zh-CN',{hour12:false});
  histories[type].unshift({time:t,user:'张三',action,result});
  if(histories[type].length>5)histories[type].pop();
  renderHistory(type);
}
function renderHistory(type){
  const el=document.getElementById(type+'History');
  if(!el)return;
  el.innerHTML=histories[type].map(h=>`<div class="history-item"><span class="h-time">${h.time}</span><span class="h-user">${h.user}</span><span class="h-action">${h.action}</span><span class="h-result ok">${h.result}</span></div>`).join('');
}

// ========== Dispatch Actions ==========
function sendDispatch(type){
  let action='',warn='';
  switch(type){
    case 'solar':
      const derate=document.getElementById('solarDerateSlider').value;
      action=`降额运行至 ${derate}% · 目标267MW · 有效期${document.getElementById('solarValid').value}`;
      break;
    case 'storage':
      const mode=document.querySelector('#storageMode .mode-btn.active').dataset.mode;
      const freqMode=document.querySelector('#freqMode .mode-btn.active');
      const freqLabel=freqMode?freqMode.textContent:'';
      const freqCap=document.querySelector('#freqMode+.form-row input')?document.querySelector('#freqMode+.form-row input').value:'20';
      if(mode==='plan'){
        const dir=document.getElementById('storageDir').value;
        const target=document.getElementById('storageTarget').value;
        action=`计划${dir} · ${target}MW · SOC目标${document.getElementById('storageSOCTarget').value}% · 调频:${freqLabel} ${freqCap}MW`;
      }else{
        action=`紧急功率支撑 · ${document.getElementById('storageEmergDir').value} · 调频:${freqLabel}`;
      }
      break;
    case 'load':
      if(!document.getElementById('loadNotify').checked){showToast('error','请先勾选「用户知情通知已发送」');return;}
      const tier=document.querySelector('#loadTiers .tier-chip.active').dataset.tier;
      const drMode=document.querySelector('#drMode .mode-btn.active');
      const drLabel=drMode?drMode.textContent:'邀约';
      const dirVal=document.getElementById('loadDir').value;
      const peakV=document.getElementById('peakSlider')?document.getElementById('peakSlider').value:'25';
      action=`DR:${drLabel} · ${['升1℃','升2℃','升3℃','全切'][tier-1]} · ${dirVal} · ${peakV}MW · 补偿¥${document.querySelector('#loadDir+select+input')?document.querySelector('#loadDir+select+input').value:'1.5'}/kWh`;
      break;
    case 'charger':
      const sel=document.querySelector('.station-card.selected');
      const station=sel?sel.dataset.station:'CP-001';
      const pwr=document.getElementById('chargerPowerSlider').value;
      action=`${station} 批量调节至 ${pwr}kW · 有序充电`;
      break;
  }
  addHistory(type,action,'✅ 下发成功');
  showToast('success','✅ 调度指令已成功下发');
}

function sendEmergency(type){
  addHistory(type,'🛑 紧急脱网指令','✅ 已执行');
  showToast('error','🚨 紧急停机指令已下发！目标功率降至 0MW');
}

// ========== Type-specific Charts ==========
function initTypeCharts(type){
  if(type==='solar')initSolarCharts();
  else if(type==='storage')initStorageCharts();
  else if(type==='load')initLoadCharts();
  else if(type==='charger')initChargerCharts();
}

  const forecast=[445,448,450,452,455,460,465,470,478,485,492,500,508,515,520,525,530,532,535,538,540,542,545,548,550,548,545,540,535,530,525];
  c.setOption({
    tooltip:{trigger:'axis',backgroundColor:'rgba(6,30,60,0.95)',borderColor:'#00d4ff',textStyle:{color:'#e0f0ff'}},
    legend:{bottom:0,textStyle:{color:'#7eb8da',fontSize:9},itemWidth:12,itemHeight:8},
    grid:{left:50,right:20,top:16,bottom:30},
    xAxis:{type:'category',data:minutes,axisLabel:{color:'#7eb8da',fontSize:8,interval:4}},
    yAxis:{type:'value',name:'MW',splitLine:{lineStyle:{color:'rgba(0,180,255,0.08)'}},axisLabel:{color:'#7eb8da',fontSize:9}},

      {name:'实测功率',type:'line',smooth:true,data:actual,lineStyle:{color:'#00d4ff',width:2.5},symbol:'none',

      {name:'辐照预测',type:'line',smooth:true,data:forecast,lineStyle:{color:'#ffaa00',width:2,type:'dashed'},symbol:'none',

      {name:'偏差>10%',type:'bar',data:actual.map((a,i)=>{const d=Math.abs(forecast[i]-a)/a*100;return d>10?d:0;}),
        barWidth:4,itemStyle:{color:'rgba(255,107,107,0.7)',borderRadius:[2,2,0,0]}}

// ========== Type-specific Events ==========
function attachTypeEvents(type){
  if(type==='solar'){
    document.querySelectorAll('#solarMode .mode-btn').forEach(b=>{
      b.addEventListener('click',function(){
        document.querySelectorAll('#solarMode .mode-btn').forEach(x=>x.classList.remove('active'));
        this.classList.add('active');
        const mode=this.dataset.mode;
        document.getElementById('solarDeratePanel').style.display=mode==='derate'?'block':'none';
        document.getElementById('solarWarn').classList.toggle('show',mode==='disconnect');
      });
    });
    const slider=document.getElementById('solarDerateSlider');
    if(slider){
      slider.addEventListener('input',function(){
        document.getElementById('solarDerateVal').textContent=this.value+'%';
        document.getElementById('solarTarget').value=Math.round(445*this.value/100);
      });
    }
  }
  if(type==='storage'){
    document.querySelectorAll('#storageMode .mode-btn').forEach(b=>{
      b.addEventListener('click',function(){
        document.querySelectorAll('#storageMode .mode-btn').forEach(x=>x.classList.remove('active'));
        this.classList.add('active');
        const m=this.dataset.mode;
        document.getElementById('storagePlanPanel').style.display=m==='plan'?'block':'none';
        document.getElementById('storageEmergPanel').style.display=m==='emergency'?'block':'none';
        document.getElementById('storageWarn').classList.toggle('show',m!=='emergency');
      });
    });
    // Frequency mode toggle
    document.querySelectorAll('#freqMode .mode-btn').forEach(b=>{
      b.addEventListener('click',function(){
        document.querySelectorAll('#freqMode .mode-btn').forEach(x=>x.classList.remove('active'));
        this.classList.add('active');
      });
    });
    const socSlider=document.getElementById('storageSOCTarget');
    if(socSlider){
      socSlider.addEventListener('input',function(){
        document.getElementById('storageSOCVal').textContent=this.value+'%';
      });
    }
  }
  if(type==='load'){
    // DR mode toggle
    document.querySelectorAll('#drMode .mode-btn').forEach(b=>{
      b.addEventListener('click',function(){
        document.querySelectorAll('#drMode .mode-btn').forEach(x=>x.classList.remove('active'));
        this.classList.add('active');
      });
    });
    // Tier selector
    document.querySelectorAll('#loadTiers .tier-chip:not(.blocked)').forEach(c=>{
      c.addEventListener('click',function(){
        document.querySelectorAll('#loadTiers .tier-chip').forEach(x=>x.classList.remove('active'));
        this.classList.add('active');
      });
    });
    // Peak shaving slider
    const peakSlider=document.getElementById('peakSlider');
    if(peakSlider){
      peakSlider.addEventListener('input',function(){
        document.getElementById('peakVal').textContent=this.value+' MW';
      });
    }
    // Direction change - toggle peak fill
    const loadDir=document.getElementById('loadDir');
    if(loadDir){
      loadDir.addEventListener('change',function(){
        const row=document.getElementById('peakRow');
        if(row){
          const label=row.querySelector('label');
          if(label)label.textContent=this.value==='削峰 (降载)'?'削峰目标':'填谷目标';
        }
      });
    }
    const notify=document.getElementById('loadNotify');
    if(notify){
      notify.addEventListener('change',function(){
        document.getElementById('loadSendBtn').disabled=!this.checked;
      });
    }
  }
  if(type==='charger'){
    document.querySelectorAll('.station-card').forEach(card=>{
      card.addEventListener('click',function(){
        document.querySelectorAll('.station-card').forEach(x=>x.classList.remove('selected'));
        this.classList.add('selected');
      });
    });
    const pSlider=document.getElementById('chargerPowerSlider');
    if(pSlider){
      pSlider.addEventListener('input',function(){
        document.getElementById('chargerPowerVal').textContent=this.value+' kW';
      });
    }
  }
}

// ========== Bottom Charts ==========
function renderBottomCharts(type){
  if(bottomChart1){bottomChart1.dispose();bottomChart1=null;}
  if(bottomChart2){bottomChart2.dispose();bottomChart2=null;}

  bottomChart1=echarts.init(document.getElementById('bottomChart1'));
  bottomChart2=echarts.init(document.getElementById('bottomChart2'));

  const mins=Array.from({length:30},(_,i)=>`-${30-i}min`);
  bottomChart1.setOption({
    title:{text:'近30min 功率趋势',textStyle:{color:'#e0f0ff',fontSize:11},left:'center',top:4},
    tooltip:{trigger:'axis',backgroundColor:'rgba(6,30,60,0.95)',borderColor:'#00d4ff'},
    grid:{left:42,right:12,top:32,bottom:12},
    xAxis:{type:'category',data:mins,axisLabel:{color:'#7eb8da',fontSize:7},axisLine:{lineStyle:{color:'rgba(0,180,255,0.2)'}}},
    yAxis:{type:'value',splitLine:{lineStyle:{color:'rgba(0,180,255,0.06)'}},axisLabel:{color:'#7eb8da',fontSize:8}},
    series:[{type:'line',data:Array.from({length:30},()=>Math.round(300+Math.random()*200)),smooth:true,
      lineStyle:{color:type==='solar'?'#ffaa00':type==='storage'?'#00ff88':type==='load'?'#ff8264':'#b482ff',width:1.5},
      areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(0,212,255,0.2)'},{offset:1,color:'rgba(0,212,255,0.01)'}]}},symbol:'none'}]
  });

  const futureMins=Array.from({length:30},(_,i)=>`+${i+1}min`);
  bottomChart2.setOption({
    title:{text:'未来30min 预测曲线',textStyle:{color:'#e0f0ff',fontSize:11},left:'center',top:4},
    tooltip:{trigger:'axis',backgroundColor:'rgba(6,30,60,0.95)',borderColor:'#00d4ff'},
    grid:{left:42,right:12,top:32,bottom:12},
    xAxis:{type:'category',data:futureMins,axisLabel:{color:'#7eb8da',fontSize:7}},
    yAxis:{type:'value',splitLine:{lineStyle:{color:'rgba(0,180,255,0.06)'}},axisLabel:{color:'#7eb8da',fontSize:8}},
    series:[{type:'line',data:Array.from({length:30},(_,i)=>Math.round(350+i*2+Math.sin(i/4)*15)),smooth:true,
      lineStyle:{color:'#ffaa00',width:1.5,type:'dashed'},symbol:'none'}]
  });
}

// ========== Init ==========
document.addEventListener('DOMContentLoaded',()=>{
  switchType('solar');
  setTimeout(()=>{
    if(currentType!=='solar'){switchType(currentType);}
  },100);
});

// Resize
window.addEventListener('resize',()=>{
  [bottomChart1,bottomChart2].forEach(c=>c&&c.resize());
  ['chartSolarPred','chartStorageBar','chartLoadDist','chartChargerGauge'].forEach(id=>{
    const el=document.getElementById(id);
    if(el){const instance=echarts.getInstanceByDom(el);if(instance)instance.resize();}
  });
});
</script>
